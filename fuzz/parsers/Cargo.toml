# cargo-fuzz targets for tarae's readers of what a sandboxed run sends (V2, README.md): the readers' modules
# included from tarae's tree as they are, each target one call to the property its in-tree loop holds (`check`).
# Outside tarae's workspace and the plugin fuzzer's (../Cargo.toml), own lockfile, on the nightly in
# rust-toolchain.toml — nothing here touches tarae's build.
[package]
name = "tarae-fuzz-parsers"
version = "0.0.0"
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[lib]
path = "src/lib.rs"
test = false
doc = false

[dependencies]
libc = "0.2"
libfuzzer-sys = "0.4"
# The web reader, the fetch's gzip and the page's own language server's answers: tarae's crate, its properties and
# fuzz inputs (`check`) turned on
tarae-web = { path = "../../crates/tarae-web", features = ["check"] }

# `fuzzing`: what cargo-fuzz sets, and what builds the sandbox's readers' `check` modules (included by `#[path]`)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# Line tables in a crash's stack
[profile.release]
debug = 1

[[bin]]
name = "sockaddr"
path = "fuzz_targets/sockaddr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "netlink"
path = "fuzz_targets/netlink.rs"
test = false
doc = false
bench = false

[[bin]]
name = "msghdr"
path = "fuzz_targets/msghdr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "head"
path = "fuzz_targets/head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sni"
path = "fuzz_targets/sni.rs"
test = false
doc = false
bench = false

[[bin]]
name = "body"
path = "fuzz_targets/body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "web"
path = "fuzz_targets/web.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response"
path = "fuzz_targets/response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "facts"
path = "fuzz_targets/facts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gzip"
path = "fuzz_targets/gzip.rs"
test = false
doc = false
bench = false
