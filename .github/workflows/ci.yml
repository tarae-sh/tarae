name: CI

# Run by hand (Actions → CI → Run workflow) — nothing starts on its own: no pushes, pull requests or schedule,
# so the shared runners see this project only when asked. The same checks run locally before a push
# (CONTRIBUTING.md).
on:
  workflow_dispatch:
    inputs:
      perf_report:
        description: Run the time-budgets report job (compat-tests profile, report only)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job builds with the toolchain rust-toolchain.toml pins (its components and targets too):
# `rustup toolchain install` with no name installs that one — the version is written there only.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets --features bundled-grammars

  # Linux's tests: x86_64, an unprivileged user, a newer git — what the maintainer's Mac isn't. macOS's tests aren't
  # CI's at all: the Mac builds and runs them at every landing (`:preflight`, `:preflight-full`)
  test:
    name: test (linux${{ matrix.features && format(', {0}', matrix.features) || '' }})
    # A hang ends the job, not the driver: on PR #9's run xtask's record::tests held both Linux jobs five hours until
    # cancelled; a cold test run takes ~21 min, so 45 min guards against hangs with room to spare
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: ["", bundled-grammars]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.features }}
      # Tests commit into throwaway repos (git hunks, disk sync)
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      # Every failing test binary said at once (cargo stops at the first otherwise: one failure a round)
      - run: cargo test --locked --no-fail-fast --workspace --features "${{ matrix.features }}"

  # Time budgets on Linux, opt-in (`perf_report`) and report-only: time is judged on the maintainer's Mac, by
  # `cargo perf` in `:preflight-full` (a shared runner's numbers are its neighbours' too). It has its own job so it
  # never slows the test jobs or turns them red; it uses `compat-tests` (release without LTO, 16 units) because
  # `perf`'s fat LTO build was killed about 25 min in (exit 143, cause unconfirmed). No step ends failed: build and
  # budgets bound cargo with coreutils `timeout`, record their exit code and exit 0, while `continue-on-error: true`
  # and the step `timeout-minutes` serve as the backstop for a kill, and the job's `timeout-minutes` sits above the
  # steps' sum.
  # `--features dev-grammars` supplies the rust grammar the syntax budgets need outside debug builds.
  perf-report:
    name: perf report (linux${{ matrix.features && format(', {0}', matrix.features) || '' }})
    if: inputs.perf_report
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        features: ["", bundled-grammars]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: perf-report-${{ matrix.features }}
      # Tests commit into throwaway repos (git hunks, disk sync)
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: build perf budgets
        id: build
        shell: bash
        continue-on-error: true
        timeout-minutes: 25
        run: |
          timeout -k 1m 20m cargo test --locked --features dev-grammars --features "${{ matrix.features }}" --profile compat-tests --bin tarae --no-run && code=0 || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: perf budgets (report only)
        id: budgets
        if: steps.build.outputs.code == '0'
        shell: bash
        continue-on-error: true
        timeout-minutes: 25
        env:
          # the 16 ms key → frame budget times this, so what's reported over is well over
          TARAE_PERF_SLACK: "3"
        run: |
          timeout -k 1m 20m cargo test --locked --features dev-grammars --features "${{ matrix.features }}" --profile compat-tests --bin tarae -- perf_budget > perf-budgets.txt 2>&1 && code=0 || code=$?
          compiled=$(grep -c 'Compiling' perf-budgets.txt || true)
          {
            if [ "$code" -eq 124 ]; then
              echo "### perf budgets, report only (timed out, exit $code)"
            else
              echo "### perf budgets, report only (exit $code)"
            fi
            echo "Cargo Compiling lines: $compiled (0 = ran built binary)"
            echo '```'
            grep -E '^test .*FAILED$|panicked at|^test result' perf-budgets.txt || echo 'no result line: see the artifact'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 perf-budgets.txt
      - name: report build failure
        if: always() && steps.build.outputs.code != '0'
        shell: bash
        continue-on-error: true
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_CODE: ${{ steps.build.outputs.code }}
        run: |
          {
            if [ "$BUILD_CODE" = "124" ]; then
              echo "### perf budgets, report only (build timed out, exit 124)"
            elif [ -n "$BUILD_CODE" ]; then
              echo "### perf budgets, report only (build failed, exit $BUILD_CODE)"
            else
              echo "### perf budgets, report only (build did not succeed: outcome ${BUILD_OUTCOME:-unknown})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: perf-budgets-linux${{ matrix.features && format('-{0}', matrix.features) || '' }}
          path: perf-budgets.txt
          if-no-files-found: ignore

  # The tests that need the network, by name (`#[ignore = "network: …"]`): a grammar downloaded and built from
  # GitHub, a new plugin built and tested with the SDK's crates (`tarae plugin test`: its own test, another API's
  # refused, `tarae plugin dev`'s round), the bundled plugins' own suites and the SDK's mock host's, a page fetched
  # through tarae's proxy (which in a test dials past this machine only with TARAE_MEASURE_REACHES_NETWORK). The rest
  # of `--ignored` isn't CI's — children run in a process of their own, measurements, checks by hand on a VM, the
  # installed claude's
  # (preflight's cis_network_job_runs_every_network_test_and_only_those)
  network:
    runs-on: ubuntu-latest
    # (as the test jobs: a hang ends the job)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # RUSTFLAGS unset, not emptied (an empty value wins too): cargo takes rustflags from one place only and
      # RUSTFLAGS wins over a config's, so `tarae plugin test` would build the bundled db plugin without its
      # .cargo/config.toml's `--cfg getrandom_backend="custom"` and getrandom 0.4 refuses wasm32. The SDK's own
      # tests deny warnings in the test itself
      - run: env -u RUSTFLAGS TARAE_MEASURE_REACHES_NETWORK=1 cargo test --locked --bin tarae -- --ignored --exact grammar::tests::grammar_install_e2e plugin::cli::tests::a_new_plugin_passes_its_own_test plugin::cli::tests::a_plugin_built_for_another_api_fails_its_test plugin::cli::tests::plugin_dev_builds_marks_and_installs_a_new_plugin plugin::cli::tests::the_bundled_sdk_passes_its_own_tests plugin::cli::tests::the_bundled_db_passes_its_own_tests plugin::cli::tests::the_bundled_keycast_passes_its_own_tests plugin::cli::tests::the_bundled_kubernetes_passes_its_own_tests plugin::cli::tests::the_bundled_demo_passes_its_own_tests web::fetch::tests::a_real_page_is_fetched
