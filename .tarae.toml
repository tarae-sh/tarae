# tarae's own project settings — working on tarae in tarae
[editor]
restart-build = "cargo build --release"
restart-binary = "target/release/tarae"

# A code review's grades (`risk.rs`): every change to these is high-risk — looked at by a person (space v h)
# before the review ends or a session is brought; snapshots and docs are quiet
[review]
risky = [
  "sandbox*", "landlock.rs", "seccomp.rs", "allow.rs", "trust.rs", "builds.rs", "build.rs", ".github/",
  ".tarae.toml",
  # the JIT's emitters: a missed bounds check in the code it writes is a hole in plugins' sandbox
  "crates/tarae-wasm/src/jit/",
]
quiet = ["src/snapshots/", "docs/"]
# What draws the screen: a change there brings the board's design angle (space v C)
screen = [
  "src/term.rs", "src/chrome.rs", "src/screen.rs", "src/codeview.rs", "src/markdown.rs",
  "src/themes/",
]

# A workspace's plans, measurements and commit drafts (.sb/, git-ignored) go to the main checkout's
# .sb/sessions/<name>/ when it ends — git worktree remove deletes ignored files too
[workspace]
keep = [".sb"]

[llm]
# tarae's own tests (plugin …) connect to their own port-0 listeners — opens every local port,
# the risky ones too
sandbox-localhost = true
# What a Docker card's `a` lets vary of `cargo xtask linux` (#139, the user's decision 2026-10-27): its acts, the
# namespaces' switches, the test binary and the repeat count, test names after `--` — each picks among what this
# repository's pinned `xtask/` does. `--image` (any image), `--env`, `--kept`/`--installed` (into the container's
# shell), `--platform` and an option after `--` (into `cargo test`'s runners) ask each time
docker-inert = ["cargo xtask linux: clippy test --userns --docker-default --bin= --repeat= --"]

# What CI checks (perf's slower number: a pass with a note; a machine too busy to measure on fails — never a
# pass, user 2026-10-24). `:preflight` — and before a
# session is brought — runs the quick set; `:preflight-full`, before publishing, every step (`full = true` too)
[preflight]
steps = [
  { name = "fmt", cmd = "cargo fmt --all --check" },
  { name = "clippy", cmd = "cargo clippy --workspace --all-targets -- -D warnings" },
  { name = "clippy bundled", cmd = "cargo clippy --workspace --all-targets --features bundled-grammars -- -D warnings", full = true },
  { name = "test", cmd = "cargo test --workspace" },
  { name = "test bundled", cmd = "cargo test --workspace --features bundled-grammars", full = true },
  { name = "perf", cmd = "cargo perf", note = "SLOWER", full = true },
]

# What a card for one of Claude's commands warns of besides the packs' (`cardwarn.rs`): `cargo xtask linux` runs
# Docker, and a hung container holds the run. (Its settings it names itself in the sandbox — `DOCKER_CONFIG` an empty
# folder of its own, `DOCKER_HOST` colima's; outside it, your own `docker`'s, as that card says it runs as you — #139)
[[cards.warn]]
id = "xtask-linux-docker"
run = ["cargo xtask linux"]
missing = [
  { wrapper = ["timeout", "gtimeout"], say = "no timeout — a hung container holds the run" },
]
say = "cargo xtask linux runs Docker: {missing}."
