# PHP.

# Read by Composer as soon as it's on disk
config-files = { json = ["composer.json"] }

# PHP's: `PHP Fatal error:  Uncaught Exception: x …`, `Parse error: …`, a trace's `thrown` — each `in /abs/a.php on
# line 12`
[[places]]
match = '^(?:PHP )?(?:(?<severity>Fatal error|Parse error|Warning|Notice): +)?(?<message>.*?) in (?<path>\S+\.php) on line (?<line>\d+)$'

# Its files that are code: a token-like line there is code, not a token (`tokens::not_settings`)
[sandbox]
not-settings = ["php"]

[language.php]
title = "PHP"
extensions = ["php"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
doc-comments = { block = "/**" }

[grammar.php]
git = "https://github.com/tree-sitter/tree-sitter-php"
rev = "f860e598194f4a71747f91789bf536b393ad4a56"
