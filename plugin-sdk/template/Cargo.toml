[package]
name = "NAME"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# tarae's SDK, as this tarae vendored it (`tarae plugin vendor` writes it again): the bindings, and helpers
tarae-plugin = { path = "tarae/sdk" }

[dev-dependencies]
# The mock host your tests drive the plugin through (`tarae_plugin::test`) — never in the wasm
tarae-plugin = { path = "tarae/sdk", features = ["test"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Builds on its own, even inside another workspace — tarae's vendored SDK (`tarae/`) a dependency, not a member (its
# tests aren't yours)
[workspace]
exclude = ["tarae"]
